[project]
name = "order-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Maazake", email = "adam951231535@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.142.2",
    "psycopg2-binary>=2.9.13",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-env>=1.8.0",
    "ruff>=0.16.10",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
src = ["."]
extend-exclude = ["alembic/versions"]

[tool.pytest.ini_options]
env = [
    "SECRET_KEY=test-only-secret-key-not-for-production-0123",
    "DATABASE_URL=postgresql+psycopg2://user:password@host:5432/nazwa_bazy"
]
